name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # QuickJS is the JS runtime yt-dlp needs for YouTube.
      # If this step fails the APK is still built (other sites keep working).
      - name: Build QuickJS (arm64 + armv7)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/quickjs
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S /tmp/quickjs -B /tmp/qjs-$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF
            cmake --build /tmp/qjs-$ABI --target qjs -j4
            mkdir -p app/src/main/jniLibs/$ABI
            cp "$(find /tmp/qjs-$ABI -maxdepth 2 -name qjs -type f | head -n1)" app/src/main/jniLibs/$ABI/libqjs.so
          done
          find app/src/main/jniLibs -type f

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Stown.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stown-apk
          path: Stown.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stown build ${{ github.run_number }}
          files: Stown.apk
          prerelease: true
